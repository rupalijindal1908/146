<!DOCTYPE html>
<html lang="en">
<head>

    <title>Document</title>
    <style>
        body{

        }

        }

        }

            color: grey;
        }
    </style>
</head>

        var seconds = 0;
        setInterval(function(){
          seconds = seconds + 1;
          document.getElementById("timer").textContemt = "you have been here for " + seconds + "seconds";          
        },1000);
        function checkForm(){
            var name = document.getElementById("name").value;
        }
    </script>
</body>
</html>
